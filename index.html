<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fill in the Blank</title>
<meta name="description" content="Offline fill-in-the-blank practice for English learners in Myanmar.">
<meta name="theme-color" content="#0b1230">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ===================================================================
   Fill in the Blank · v1.0.0
   Theme: deep navy, animated glow, glass cards, chunky neon blocks.
   =================================================================== */
@font-face{font-family:"Noto Sans Myanmar";src:url("fonts/NotoSansMyanmar-Regular.woff2") format("woff2");font-weight:400;font-display:swap;unicode-range:U+1000-109F,U+A9E0-A9FF,U+AA60-AA7F,U+200B-200D,U+25CC}
@font-face{font-family:"Noto Sans Myanmar";src:url("fonts/NotoSansMyanmar-Bold.woff2") format("woff2");font-weight:700;font-display:swap;unicode-range:U+1000-109F,U+A9E0-A9FF,U+AA60-AA7F,U+200B-200D,U+25CC}
:root{
  --bg:#0b1230; --bg2:#121b45; --ink:#eef2ff; --muted:#aab4dd; --line:rgba(255,255,255,.14);
  --glass:rgba(255,255,255,.065); --glass2:rgba(255,255,255,.1);
  --cyan:#3ee6ff; --violet:#9b7bff; --pink:#ff6fb1; --sun:#ffd447; --sun-d:#d99a00;
  --ok:#3ddc97; --ok-d:#169c63; --bad:#ff6b81; --bad-d:#c63750;
  --grad:linear-gradient(135deg,var(--cyan),var(--violet) 55%,var(--pink));
  --r:18px; --chip-r:14px; --fs:1; --tap:44px;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Myanmar","Padauk","Myanmar Text","Pyidaungsu",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:calc(16px * var(--fs))}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 15%,rgba(62,230,255,.20),transparent 70%),
             radial-gradient(35% 30% at 85% 25%,rgba(155,123,255,.22),transparent 70%),
             radial-gradient(45% 40% at 60% 95%,rgba(255,111,177,.16),transparent 70%),var(--bg);
  animation:glow 22s ease-in-out infinite alternate}
@keyframes glow{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-2%,0) scale(1.05)}100%{transform:translate3d(-3%,2%,0) scale(1.02)}}
:lang(my),.my{line-height:1.95}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.5rem;padding:.55rem max(.8rem,env(safe-area-inset-left));
  background:rgba(11,18,48,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.08rem;letter-spacing:.2px;cursor:pointer;background:none;border:0;padding:.2rem .3rem;min-height:var(--tap)}
.brand svg{width:38px;height:38px;flex:none}
.brand .t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.appbar .sp{flex:1}
.iconbtn{min-width:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:0 .7rem;border-radius:14px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-weight:700;font-size:.92rem}
.iconbtn:hover{background:var(--glass2)}
.iconbtn .ic{font-size:1.1rem;line-height:1}
@media (max-width:560px){.iconbtn .lbl{display:none}.brand .t{font-size:.98rem}}
.brand .t{white-space:nowrap}
@media (max-width:380px){.brand .t{display:none}}
@media (max-width:640px){.exhead .title{flex-basis:calc(100% - 60px)}.exhead .nl{display:none}.exhead .btn.small{min-width:52px}}

/* ---------- Layout ---------- */
main{max-width:1240px;margin:0 auto;padding:1rem max(.8rem,env(safe-area-inset-left)) 2rem}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.stack>*+*{margin-top:1rem}
h1,h2,h3{line-height:1.3;margin:0 0 .5rem}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.sub{display:block;font-size:.72em;font-weight:600;opacity:.8;line-height:1.3}
@media (max-width:520px){.sub{display:none}}

.btn{min-height:var(--tap);padding:.55rem 1.05rem;border-radius:14px;border:0;cursor:pointer;font-weight:800;font-size:.98rem;
  background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 4px 0 rgba(0,0,0,.35);transition:transform .12s var(--ease),filter .12s;text-align:center;line-height:1.25}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 1px var(--line),0 1px 0 rgba(0,0,0,.35)}
.btn.primary{background:var(--grad);color:#0b1230;box-shadow:0 4px 0 #5a3cc0}
.btn.good{background:var(--ok);color:#06241a;box-shadow:0 4px 0 var(--ok-d)}
.btn.danger{background:var(--bad);color:#2a0710;box-shadow:0 4px 0 var(--bad-d)}
.btn.small{min-height:38px;padding:.35rem .75rem;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}

/* ---------- Home / Library ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center}
.hero svg.moo{width:118px;height:118px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@media (max-width:520px){.hero{grid-template-columns:1fr;text-align:center}.hero svg.moo{margin:0 auto}}
.drop{border:2px dashed rgba(62,230,255,.45);border-radius:var(--r);padding:1.2rem;text-align:center;transition:background .2s,border-color .2s}
.drop.over{background:rgba(62,230,255,.1);border-color:var(--cyan)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.set{display:flex;flex-direction:column;gap:.55rem}
.set h3{margin:0;word-break:break-word}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .5s var(--ease)}
.warn{background:rgba(255,212,71,.12);border:1px solid rgba(255,212,71,.45);color:#ffe9a3;border-radius:12px;padding:.5rem .7rem;font-size:.92rem}
.errlist{margin:.4rem 0 0;padding-left:1.1rem;font-size:.92rem;max-height:220px;overflow:auto}
.errlist li.w{color:#ffe9a3}.errlist li.e{color:#ffc1cb}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.78rem;font-weight:800;background:rgba(255,255,255,.1)}

/* ---------- Exercise ---------- */
.exhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.exhead .title{flex:1;min-width:180px}
.exhead .meter{margin-top:.35rem}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:1rem;align-items:start}
.passage{font-size:1.18rem;line-height:2.35}
.passage p{margin:0 0 .9rem}
.instr{font-weight:700;color:#d9e1ff;margin-bottom:.7rem}
.hintcard{margin:.2rem 0 .8rem;padding:.55rem .8rem;border-radius:12px;background:rgba(255,212,71,.12);border:1px solid rgba(255,212,71,.4)}
.feedback{margin-top:1rem;padding:.8rem 1rem;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.feedback .big{font-size:1.5rem;font-weight:900}

.blank{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:4.4em;min-height:var(--tap);margin:.12rem .15rem;padding:2px 6px;
  border-radius:12px;border:2px dashed rgba(170,180,221,.65);background:rgba(255,255,255,.04);cursor:pointer;position:relative;line-height:1.3;max-width:100%;transition:border-color .2s,background .2s,box-shadow .2s}
.blank .num{font-size:.78rem;font-weight:900;color:var(--muted);padding:0 .2rem;white-space:nowrap}
.blank .peek{font-family:var(--mono);font-size:.95rem;color:#ffe9a3;letter-spacing:.06em;margin-left:.2rem}
.blank.filled{border-style:solid;border-color:transparent;background:transparent;padding:0;min-width:0}
.blank.filled .num,.blank.filled .peek{display:none}
.blank.target{border-color:var(--cyan);background:rgba(62,230,255,.1);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(62,230,255,.55)}50%{box-shadow:0 0 0 7px rgba(62,230,255,0)}}
.blank.drop-ok{border-color:var(--sun);background:rgba(255,212,71,.16);box-shadow:0 0 0 4px rgba(255,212,71,.25)}
.blank.ok .chip{background:linear-gradient(#5ff0b0,var(--ok));box-shadow:0 4px 0 var(--ok-d);color:#06241a}
.blank.bad .chip{background:linear-gradient(#ff97a6,var(--bad));box-shadow:0 4px 0 var(--bad-d);color:#2a0710}
.blank.bad{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.chip{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);padding:.35rem .9rem;border-radius:var(--chip-r);border:0;
  background:linear-gradient(#ffe57a,var(--sun));color:#1b1640;font-weight:800;font-size:1.05rem;line-height:1.25;cursor:grab;user-select:none;-webkit-user-select:none;
  box-shadow:0 4px 0 var(--sun-d),0 8px 16px rgba(0,0,0,.25);touch-action:pan-y;white-space:normal;word-break:break-word;text-align:center;max-width:100%;transition:filter .15s}
.chip:hover{filter:brightness(1.06)}
.chip.locked{cursor:default}
.chip.dragging-src{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;transform-origin:center;box-shadow:0 14px 30px rgba(0,0,0,.45)!important;opacity:.96}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}

.bankpanel{position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100dvh - 92px);padding:.8rem}
.bankhead{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.bankhead .h{flex:1;font-weight:900}
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-bottom:.7rem}
.toolbar .btn{padding:.35rem .3rem;font-size:.82rem;min-height:48px}
.toolbar .btn .ic{display:block;font-size:1.1rem;line-height:1.1}
.toolbar .btn.check{grid-column:span 2}
.bank{display:flex;flex-wrap:wrap;gap:.6rem;align-content:flex-start;overflow:auto;padding:.3rem .2rem .6rem;min-height:60px;border-radius:14px;transition:background .2s}
.bank.drop-ok{background:rgba(255,212,71,.1)}
.slot{display:inline-flex;max-width:100%}
.slot.empty{width:22px;min-height:var(--tap);border:2px dashed rgba(170,180,221,.35);border-radius:10px}

@media (max-width:899px){
  .exgrid{grid-template-columns:1fr}
  .bankpanel{position:sticky;top:auto;bottom:0;max-height:42vh;max-height:42dvh;border-radius:20px 20px 0 0;margin:0 calc(-1 * max(.8rem,env(safe-area-inset-left)));
    padding-bottom:max(.8rem,env(safe-area-inset-bottom));background:rgba(18,27,69,.94);z-index:20}
  .bankpanel.collapsed .bank{display:none}
  .toolbar{grid-template-columns:repeat(4,1fr)}
  .passage{font-size:1.08rem}
}
.collapse-btn{display:none}
@media (max-width:899px){.collapse-btn{display:inline-flex}}

/* ---------- Tables / math in rich text ---------- */
.tablewrap{max-width:100%;overflow-x:auto;margin:.4rem 0 1rem;border-radius:12px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.tablewrap table{border-collapse:collapse;min-width:100%;line-height:1.6;font-size:.98rem}
.tablewrap th,.tablewrap td{padding:.45rem .7rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.tablewrap th{background:rgba(155,123,255,.18)}
.tablewrap td .blank{white-space:normal}
.math{font-family:"Cambria Math","STIX Two Math",serif}
.math.block{display:block;text-align:center;margin:.5rem 0;overflow-x:auto}

/* ---------- Modal / toast ---------- */
.overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(5,9,28,.66);backdrop-filter:blur(4px)}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#1a2458,#121b45);border:1px solid var(--line);border-radius:22px;padding:1.2rem;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:pop .28s var(--ease)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.modal .actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:flex-end;margin-top:1rem}
.field{display:flex;flex-direction:column;gap:.3rem;margin:.7rem 0}
.field label{font-weight:800}
input[type=text],input[type=password],input[type=number],select{min-height:var(--tap);padding:.45rem .7rem;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.seg{display:inline-flex;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.seg button{min-height:var(--tap);padding:0 .9rem;border:0;background:transparent;cursor:pointer;font-weight:700}
.seg button[aria-pressed=true]{background:var(--grad);color:#0b1230}
.toasts{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:.5rem;width:min(460px,92vw)}
.toast{display:flex;gap:.6rem;align-items:center;padding:.7rem .9rem;border-radius:14px;background:#24306b;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.4);animation:pop .25s var(--ease)}
.toast span{flex:1}

/* ---------- Result ---------- */
.result{text-align:center}
.result svg.moo{width:120px;height:120px}
.stars{font-size:2.6rem;letter-spacing:.3rem;margin:.2rem 0}
.stars .off{opacity:.22;filter:grayscale(1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.8rem 0}
.stats div{background:rgba(255,255,255,.07);border-radius:14px;padding:.5rem}
.stats b{display:block;font-size:1.35rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- Summary / guide ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:.5rem;border-bottom:1px solid var(--line);text-align:left}
pre.code{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:.8rem;overflow:auto;font-family:var(--mono);font-size:.9rem;line-height:1.5;white-space:pre;margin:.4rem 0}
.guide h2{margin-top:1.2rem}

/* ---------- Reduced motion ---------- */
body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<!-- Moo the cow mascot (inline SVG symbol, reused with <use>) -->

    <circle cx="46" cy="56" r="7" fill="#1b1640"/><circle cx="74" cy="56" r="7" fill="#1b1640"/>

    <ellipse cx="60" cy="82" rx="26" ry="17" fill="#ffb3cf"/>

<header class="appbar">
  <button class="brand" id="brandBtn" type="button" aria-label="Home">
    <svg aria-hidden="true"><use href="#moo"></use></svg><span class="t" id="brandTitle">Fill in the Blank</span>
  </button>
  <span class="sp"></span>
  <button class="iconbtn" id="navGuide" type="button"><span class="ic" aria-hidden="true">📘</span><span class="lbl"></span></button>
  <button class="iconbtn" id="navSettings" type="button"><span class="ic" aria-hidden="true">⚙️</span><span class="lbl"></span></button>
  <button class="iconbtn" id="navLang" type="button" aria-label="Language"><span class="ic" aria-hidden="true">🌐</span><span id="langLbl">EN</span></button>
</header>
<main id="main" tabindex="-1"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="sr-only" id="live" aria-live="assertive" aria-atomic="true"></div>
<noscript><p style="padding:1rem">Please enable JavaScript to use this app.</p></noscript>

<!-- Vendor libraries (optional, loaded locally, never from a CDN).
     Missing files are fine: .xlsx/.zip features show a notice instead. -->
<script src="vendor/xlsx.full.min.js"></script>

      box.appendChild(h('p', null, sec[1]));
      if (sec[2]) {
        var pre = h('pre', { class: 'code', tabindex: '0' }, sec[2]);
        box.appendChild(pre);
        box.appendChild(h('button', { class: 'btn small', type: 'button', onclick: function (e) { var b = e.currentTarget; U.copyText(sec[2]).then(function () { b.textContent = t('copied'); setTimeout(function () { b.textContent = t('copy'); }, 1500); }); } }, t('copy')));
      }
    });
    box.appendChild(h('div', { class: 'row', style: { marginTop: '1.2rem' } }, h('button', { class: 'btn', type: 'button', onclick: function () { UI.go({ name: 'home' }); } }, t('back'))));
    main.appendChild(box);
  }
  return { render: render, DL: DL };
})();

/* ============================== pwa ==============================
   Service Worker only over http(s); skipped silently on file://.   */
var PWA = (function () {
  function init() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (reloading) return; reloading = true; location.reload(); });
    navigator.serviceWorker.register('sw.js', { scope: './' }).then(function (reg) {
      function prompt(w) { UI.toast(t('updateAvail'), { label: t('reload'), fn: function () { w.postMessage({ type: 'SKIP_WAITING' }); } }, 0); }
      if (reg.waiting && navigator.serviceWorker.controller) prompt(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing; if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed') { if (navigator.serviceWorker.controller) prompt(w); else UI.toast(t('offlineReady')); }
        });
      });
    }).catch(function () {});
  }
  return { init: init };
})();

/* ============================== boot ============================== */
(function boot() {
  Settings.apply();
  document.getElementById('brandBtn').addEventListener('click', function () { UI.go({ name: 'home' }); });
  document.getElementById('navGuide').addEventListener('click', function () { UI.go({ name: 'guide' }); });
  document.getElementById('navSettings').addEventListener('click', function () { UI.settings(); });
  document.getElementById('navLang').addEventListener('click', function () { Settings.set('lang', I18N.lang === 'en' ? 'my' : 'en'); UI.rerender(); });
  var p = Store.ready().then(function () {
    if (Store.getKVSync('seeded', false)) return;
    return BUILTIN.reduce(function (q, b, i) {
      return q.then(function () {
        var s = Importer.rowsToSet(builtinToRows(b), b.name, 'built-in');
        s.id = b.id; s.builtIn = true; s.createdAt = Date.now() - i * 1000;
        return Store.putSet(s);
      });
    }, Promise.resolve()).then(function () { Store.putKVSync('seeded', true); });
  });
  p.then(function () { UI.go({ name: 'home' }); PWA.init(); });
})();
</script>
