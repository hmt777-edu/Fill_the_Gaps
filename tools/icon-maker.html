<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Maker · Fill in the Blank</title>
<style>
  body{margin:0;background:#0b1230;color:#eef2ff;font:16px/1.6 ui-rounded,"Segoe UI",Roboto,Arial,"Noto Sans Myanmar","Padauk","Myanmar Text",sans-serif;padding:1.2rem}
  h1{margin:.2rem 0 .4rem;font-size:1.5rem}
  .muted{color:#aab4dd}
  .row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.8rem 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem;margin-top:1rem}
  .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:.8rem;text-align:center}
  .card canvas{max-width:128px;max-height:128px;width:auto;height:auto;background:repeating-conic-gradient(#1a2458 0 25%,#121b45 0 50%) 0 0/16px 16px;border-radius:12px}
  .card b{display:block;margin:.4rem 0 .1rem}
  button,label.btn{min-height:44px;padding:.5rem 1rem;border-radius:14px;border:0;font:inherit;font-weight:800;cursor:pointer;background:#24306b;color:#eef2ff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
  button.primary{background:linear-gradient(135deg,#3ee6ff,#9b7bff 55%,#ff6fb1);color:#0b1230}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
  code{background:rgba(0,0,0,.3);padding:.1rem .35rem;border-radius:6px}
</style>
</head>
<body>
<h1>🐮 Icon Maker</h1>
<p class="muted">Renders <code>icons/icon.svg</code> to every PNG the PWA needs. Works offline and from <code>file://</code>. Save the files into the <code>/icons</code> folder.<br>
<span lang="my">PNG ဖိုင်များကို ဒေါင်းလုဒ်ဆွဲပြီး <code>/icons</code> ဖိုဒါထဲသို့ ထည့်ပါ။ ကိုယ်ပိုင် icon.svg ကိုလည်း ရွေးနိုင်သည်။</span></p>
<div class="row">
  <button class="primary" id="all" type="button">⬇ Download all</button>
  <label class="btn" for="pick">📂 Use another SVG…</label><input type="file" id="pick" accept=".svg,image/svg+xml">
  <label><input type="color" id="bg" value="#0b1230"> Background (maskable / Apple)</label>
</div>
<div class="grid" id="grid"></div>

<script>
'use strict';
/* Same artwork as icons/icon.svg (embedded so no file needs to be fetched). */
var SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fill in the Blank app icon: Moo the cow + an answer block and an empty blank -->
  <defs>
    <radialGradient id="g1" cx="22%" cy="18%" r="60%"><stop offset="0" stop-color="#3ee6ff" stop-opacity=".45"/><stop offset="1" stop-color="#3ee6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="85%" cy="90%" r="60%"><stop offset="0" stop-color="#ff6fb1" stop-opacity=".4"/><stop offset="1" stop-color="#ff6fb1" stop-opacity="0"/></radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe57a"/><stop offset="1" stop-color="#ffd447"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b1230"/>
  <rect width="512" height="512" rx="112" fill="url(#g1)"/>
  <rect width="512" height="512" rx="112" fill="url(#g2)"/>
  <g transform="translate(121 34) scale(2.25)">
    <ellipse cx="22" cy="44" rx="16" ry="9" fill="#f4d6e4" transform="rotate(-25 22 44)"/>
    <ellipse cx="98" cy="44" rx="16" ry="9" fill="#f4d6e4" transform="rotate(25 98 44)"/>
    <path d="M38 26c-6-10-4-18 2-20 1 7 3 11 8 14z" fill="#ffe08a"/>
    <path d="M82 26c6-10 4-18-2-20-1 7-3 11-8 14z" fill="#ffe08a"/>
    <ellipse cx="60" cy="58" rx="38" ry="40" fill="#ffffff"/>
    <path d="M30 40c6-12 18-14 22-8 3 5-3 12-10 14s-14 2-12-6z" fill="#2b2f4a"/>
    <path d="M86 58c8 2 10 12 4 16-5 3-10-2-10-8 0-5 2-9 6-8z" fill="#2b2f4a"/>
    <circle cx="46" cy="56" r="7" fill="#1b1640"/><circle cx="74" cy="56" r="7" fill="#1b1640"/>
    <circle cx="48.5" cy="53.5" r="2.4" fill="#fff"/><circle cx="76.5" cy="53.5" r="2.4" fill="#fff"/>
    <ellipse cx="36" cy="68" rx="6" ry="3.5" fill="#ff9ec4" opacity=".7"/><ellipse cx="84" cy="68" rx="6" ry="3.5" fill="#ff9ec4" opacity=".7"/>
    <ellipse cx="60" cy="82" rx="26" ry="17" fill="#ffb3cf"/>
    <ellipse cx="51" cy="80" rx="4" ry="5" fill="#c9547f"/><ellipse cx="69" cy="80" rx="4" ry="5" fill="#c9547f"/>
    <path d="M50 90q10 7 20 0" stroke="#7a2348" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="86" y="372" width="196" height="78" rx="24" fill="#d99a00"/>
  <rect x="86" y="362" width="196" height="78" rx="24" fill="url(#chip)"/>
  <rect x="122" y="392" width="124" height="18" rx="9" fill="#1b1640" opacity=".85"/>
  <rect x="306" y="362" width="120" height="78" rx="22" fill="none" stroke="#3ee6ff" stroke-width="8" stroke-dasharray="18 12"/>
</svg>`;
var SIZES = [
  { name: 'favicon-32.png', size: 32, pad: 1 },
  { name: 'apple-touch-icon.png', size: 180, pad: 0.9, bg: true },
  { name: 'icon-192.png', size: 192, pad: 1 },
  { name: 'icon-512.png', size: 512, pad: 1 },
  { name: 'maskable-192.png', size: 192, pad: 0.8, bg: true },
  { name: 'maskable-512.png', size: 512, pad: 0.8, bg: true }
];
var grid = document.getElementById('grid'), img = new Image(), url = null;

function load(svgText) {
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
  img = new Image();
  img.onload = draw;
  img.onerror = function () { alert('This SVG could not be read.'); };
  img.src = url;
}
function render(spec) {
  var c = document.createElement('canvas'); c.width = c.height = spec.size;
  var x = c.getContext('2d');
  if (spec.bg) { x.fillStyle = document.getElementById('bg').value; x.fillRect(0, 0, spec.size, spec.size); }
  var s = Math.round(spec.size * spec.pad), o = Math.round((spec.size - s) / 2);
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, o, o, s, s);
  return c;
}
function draw() {
  grid.textContent = '';
  SIZES.forEach(function (spec) {
    var c = render(spec), card = document.createElement('div'), b = document.createElement('b'), btn = document.createElement('button');
    card.className = 'card'; b.textContent = spec.name;
    var small = document.createElement('div'); small.className = 'muted'; small.textContent = spec.size + ' × ' + spec.size + (spec.bg ? ' · full background' : '');
    btn.type = 'button'; btn.textContent = '⬇ PNG'; btn.onclick = function () { save(spec); };
    card.appendChild(c); card.appendChild(b); card.appendChild(small); card.appendChild(btn); grid.appendChild(card);
  });
}
function save(spec) {
  return new Promise(function (res) {
    render(spec).toBlob(function (blob) {
      var a = document.createElement('a'), u = URL.createObjectURL(blob);
      a.href = u; a.download = spec.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(u); res(); }, 400);
    }, 'image/png');
  });
}
document.getElementById('all').onclick = function () {
  SIZES.reduce(function (p, s) { return p.then(function () { return save(s); }); }, Promise.resolve());
};
document.getElementById('pick').onchange = function (e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader(); r.onload = function () { SVG = r.result; load(SVG); }; r.readAsText(f);
};
document.getElementById('bg').oninput = draw;
load(SVG);
</script>
</body>
</html>
